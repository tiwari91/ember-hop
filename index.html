<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<title>Ember Hop</title>
	<meta name="description" content="Ember Hop: a side-scrolling platformer about a girl finding her way home.">
	<meta name="theme-color" content="#14121c">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main id="stage">
		<canvas id="game" width="320" height="192" aria-label="Ember Hop game"></canvas>
	</main>
	<div id="touch" aria-hidden="true">
		<div class="pad dpad">
			<button class="btn dir up" data-action="up" aria-label="Up">&#9650;</button>
			<button class="btn dir left" data-action="left" aria-label="Left">&#9664;</button>
			<button class="btn dir right" data-action="right" aria-label="Right">&#9654;</button>
			<button class="btn dir down" data-action="down" aria-label="Down">&#9660;</button>
		</div>
		<div class="pad actions">
			<button class="btn act run" data-action="run" aria-label="Run"><span>B</span><small>run</small></button>
			<button class="btn act jump" data-action="jump" aria-label="Jump"><span>A</span><small>jump</small></button>
		</div>
		<button class="btn sys pause" data-action="pause" aria-label="Pause">&#10074;&#10074;</button>
	</div>
	<noscript>Ember Hop needs JavaScript.</noscript>
	<script type="module" src="js/main.js"></script>
</body>
</html>
